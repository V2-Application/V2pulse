<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATR Command Centre · V2Pulse</title>
<link rel="stylesheet" href="/theme/overrides.css">
<style>
  /* Management command centre: dark navy masthead with the day's headline numbers; below it a 12-column grid of
     cards - Claude's brief, alert mix, where the alerts are, top actions, hero health, people - then the dashboards. */
  :root {
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --fg:#0f1b2a; --fg-2:#3f4c5c; --muted:#6a7787; --line:#dde3ea;
    --mast:#0b1626; --mast-2:#13233a; --mast-fg:#e8eef6; --mast-muted:#9fb0c4;
    --brand:#1d4ed8; --series-1:#2a78d6; --series-ly:#8b95a3;
    --p1:#d03b3b; --p2:#ec835a; --p3:#9aa3ae; --good:#0ca30c;
    --seq-0:#eef4fd; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#256abf; --seq-5:#104281;
    --hero:#0d6b6b; --karma:#6d3fc0; --ai:#c2410c;
    --shadow:0 1px 2px rgba(15,27,42,.06), 0 4px 16px rgba(15,27,42,.05);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0b1119; --surface:#131c27; --surface-2:#18222f; --fg:#e6ecf2; --fg-2:#c3cdd8; --muted:#93a1b0; --line:#243243;
    --mast:#070d16; --mast-2:#101b2b; --series-1:#3987e5; --series-ly:#7d8896; --p3:#7d8794;
    --seq-0:#14202f; --seq-1:#173057; --seq-2:#1c4a85; --seq-3:#2a6ec2; --seq-4:#4f93e6; --seq-5:#8fbcf2;
    --hero:#4fb8b4; --karma:#b39af0; --ai:#fb923c; --shadow:none; color-scheme:dark; } }
  :root[data-theme="dark"] {
    --bg:#0b1119; --surface:#131c27; --surface-2:#18222f; --fg:#e6ecf2; --fg-2:#c3cdd8; --muted:#93a1b0; --line:#243243;
    --mast:#070d16; --mast-2:#101b2b; --series-1:#3987e5; --series-ly:#7d8896; --p3:#7d8794;
    --seq-0:#14202f; --seq-1:#173057; --seq-2:#1c4a85; --seq-3:#2a6ec2; --seq-4:#4f93e6; --seq-5:#8fbcf2;
    --hero:#4fb8b4; --karma:#b39af0; --ai:#fb923c; --shadow:none; color-scheme:dark; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14.5px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif }
  a { color:var(--brand) } a:focus-visible, button:focus-visible { outline:2px solid var(--series-1); outline-offset:2px }
  .num { font-variant-numeric:tabular-nums }

  .mast { background:linear-gradient(180deg, var(--mast), var(--mast-2)); color:var(--mast-fg) }
  .mast-in { max-width:1440px; margin:0 auto; padding:18px max(20px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px));
             display:flex; flex-direction:column; gap:18px }
  .topbar { display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; justify-content:space-between }
  .brand { display:flex; align-items:center; gap:10px; color:#fff; text-decoration:none; font-weight:700; font-size:15px }
  .brand i { width:26px; height:26px; border-radius:7px; background:#1d4ed8; position:relative; display:inline-block }
  .brand i::after { content:""; position:absolute; left:6px; right:6px; top:12px; height:2px; background:#fff; box-shadow:0 -5px 0 #fff, 0 5px 0 #fff }
  .jump { display:flex; flex-wrap:wrap; gap:4px }
  .jump a { color:var(--mast-muted); text-decoration:none; font-size:13px; padding:5px 10px; border-radius:999px }
  .jump a:hover { color:#fff; background:rgba(255,255,255,.08) }
  .title { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:8px 24px }
  h1 { margin:0; font-size:28px; letter-spacing:-.01em } .sub { color:var(--mast-muted); font-size:13.5px }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(175px, 1fr)); gap:12px }
  .tile { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); border-radius:12px; padding:14px 16px;
          display:flex; flex-direction:column; gap:4px; color:var(--mast-fg); text-decoration:none; min-width:0 }
  a.tile:hover { background:rgba(255,255,255,.09) }
  .tile .k { font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--mast-muted); display:flex; align-items:center; gap:6px }
  .tile .v { font-size:28px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums }
  .tile .s { font-size:12.5px; color:var(--mast-muted) }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none }

  main { max-width:1440px; margin:0 auto; padding:22px max(20px, env(safe-area-inset-right, 0px)) 60px max(20px, env(safe-area-inset-left, 0px));
         display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:16px }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px;
          display:flex; flex-direction:column; gap:14px; min-width:0; scroll-margin-top:14px }
  .c12 { grid-column:span 12 } .c8 { grid-column:span 8 } .c7 { grid-column:span 7 } .c6 { grid-column:span 6 } .c5 { grid-column:span 5 } .c4 { grid-column:span 4 }
  .ch { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px 14px }
  h2 { margin:0; font-size:16.5px } .ch .note { color:var(--muted); font-size:12.5px }
  .more { font-size:13px; text-decoration:none; white-space:nowrap }
  .sect { grid-column:span 12; display:flex; align-items:center; gap:10px; margin-top:8px; color:var(--fg-2); font-size:13px;
          letter-spacing:.06em; text-transform:uppercase; font-weight:600; scroll-margin-top:14px }
  .sect::after { content:""; flex:1; height:1px; background:var(--line) }
  .sect .bar { width:4px; height:16px; border-radius:2px }

  .chips { display:flex; flex-wrap:wrap; gap:6px }
  .chip { font:inherit; font-size:12.5px; padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
          color:var(--fg-2); cursor:pointer }
  .chip[aria-pressed="true"] { background:var(--fg); color:var(--surface); border-color:var(--fg) }
  .brief-body { display:flex; flex-direction:column; gap:10px; max-width:100ch }
  .brief-body .lead { font-size:15.5px; font-weight:600; line-height:1.45; margin:0 }
  .brief-body h3 { margin:6px 0 0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted) }
  .brief-body ul { margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px }
  .brief-foot { font-size:12px; color:var(--muted) }

  .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--fg-2) }
  .legend span { display:inline-flex; align-items:center; gap:6px }
  .legend i { width:12px; height:12px; border-radius:3px; display:inline-block }
  .legend i.line { height:2px; border-radius:1px } .legend i.dash { height:0; border-top:2px dashed var(--series-ly); background:none; border-radius:0 }
  svg text { fill:var(--muted); font-size:12px; font-family:inherit }
  svg .lbl { fill:var(--fg-2) } svg .val { fill:var(--fg); font-weight:600 }
  svg .grid { stroke:var(--line); stroke-width:1 }
  .chart { width:100%; display:block }
  .tip { position:fixed; z-index:20; pointer-events:none; background:var(--surface); color:var(--fg); border:1px solid var(--line);
         border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.18); padding:9px 12px; font-size:12.5px; min-width:150px; display:none }
  .tip .h { color:var(--muted); margin-bottom:4px } .tip .r { display:flex; justify-content:space-between; gap:16px }
  .tip .r b { font-variant-numeric:tabular-nums }

  .heat-wrap { overflow-x:auto }
  table.heat { border-collapse:separate; border-spacing:2px; width:100%; min-width:680px; font-size:12.5px }
  .heat th { font-weight:600; color:var(--fg-2); text-align:center; padding:6px 4px; font-size:12px; vertical-align:bottom }
  .heat th.z { text-align:left; padding-left:8px }
  .heat td { text-align:center; padding:9px 4px; border-radius:6px; font-variant-numeric:tabular-nums }
  .heat td.z { text-align:left; font-weight:600; padding-left:8px }
  .heat td.tot { font-weight:700; background:var(--surface-2) }
  .scale { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted) }
  .scale i { width:22px; height:10px; border-radius:2px; display:inline-block }

  .acts { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px }
  .act { border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--surface-2); min-width:0 }
  .act h3 { margin:0; font-size:14px; display:flex; justify-content:space-between; gap:8px; align-items:baseline }
  .act h3 small { font-weight:400; color:var(--muted); font-size:12px }
  .act ol { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px }
  .act li { display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px; font-size:13px; line-height:1.4 }
  .pill { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; color:#fff; height:fit-content; margin-top:2px }
  .pill.P1 { background:var(--p1) } .pill.P2 { background:var(--p2) } .pill.P3 { background:var(--p3) }
  .act .w { font-weight:600; overflow-wrap:anywhere } .act .m { color:var(--muted); font-size:12px; overflow-wrap:anywhere }

  .tbl { overflow-x:auto } table.mini { border-collapse:collapse; width:100%; font-size:13px; min-width:560px }
  .mini th { text-align:right; font-weight:600; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--line) }
  .mini th:first-child, .mini td:first-child { text-align:left }
  .mini td { text-align:right; padding:7px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums }
  .mini tr:last-child td { border-bottom:0 }
  .mini td .t { font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:300px }
  .mini td .m { color:var(--muted); font-size:12px }

  .dir { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px }
  .dcard { border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; background:var(--surface) }
  .dcard h3 { margin:0; font-size:14.5px } .dcard h3 a { color:var(--fg); text-decoration:none } .dcard h3 a:hover { color:var(--brand) }
  .dcard p { margin:0; color:var(--muted); font-size:13px }
  .dchips { display:flex; flex-wrap:wrap; gap:5px }
  .dchips a { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); text-decoration:none; color:var(--fg-2) }
  .dchips a:hover { border-color:var(--brand); color:var(--brand) }
  .tag { font-size:11px; font-weight:600; padding:2px 8px; border-radius:5px; align-self:flex-start; color:#fff }

  .empty { color:var(--muted); font-size:13px; padding:6px 0 }
  .notice { grid-column:span 12; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; color:var(--muted) }
  @media (max-width:1180px) { .acts { grid-template-columns:repeat(2, minmax(0,1fr)) }
    .c8, .c7, .c6, .c5, .c4 { grid-column:span 12 } .dir { grid-template-columns:repeat(2, minmax(0,1fr)) } }
  @media (max-width:640px) { .tiles { grid-template-columns:repeat(2, minmax(0,1fr)) } .acts, .dir { grid-template-columns:minmax(0,1fr) }
    h1 { font-size:23px } .tile .v { font-size:23px } }
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <div class="topbar">
      <a class="brand" href="/"><i aria-hidden="true"></i>V2Pulse</a>
      <nav class="jump" aria-label="Sections">
        <a href="#s-brief">Brief</a><a href="#s-where">Where</a><a href="#s-actions">Actions</a><a href="#s-hero">Hero health</a><a href="#s-fill">Fill rate</a>
        <a href="#s-people">People</a><a href="#s-dir">All dashboards</a><a href="/">← Back to V2Pulse</a>
      </nav>
    </div>
    <div class="title">
      <div><h1>ATR Command Centre</h1><div class="sub" id="who">Loading your scope…</div></div>
      <div class="sub" id="asof"></div>
    </div>
    <div class="tiles" id="tiles" aria-live="polite"></div>
  </div>
</header>
<main id="main">
  <div class="notice" id="status">Loading…</div>
</main>
<div class="tip" id="tip" role="tooltip"></div>
<script src="/analytics/app.js"></script>
</body>
</html>
